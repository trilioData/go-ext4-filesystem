name: test

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  # Unit tests plus the image tests, which build real ext4 images with
  # mke2fs -d and debugfs (no root needed). Two Ubuntu releases so both
  # e2fsprogs 1.46 and 1.47 produce the images.
  test:
    name: unit + image tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install e2fsprogs
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))
          [ -z "$out" ] || { echo "not gofmt-ed:"; echo "$out"; exit 1; }
      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./e2e/
      - name: go test
        env:
          EXT4_REQUIRE_TOOLS: "1" # fail instead of skipping the image tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

  # A real ext4 disk, formatted with mkfs.ext4 and populated through a kernel
  # mount, is cloned with this library and compared with the original (in Go
  # and with rsync). Needs root for mount, mknod and chown.
  e2e-clone:
    name: e2e clone (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stock defaults on the newest runner, so new mkfs.ext4 defaults
          # show up here first.
          - name: stock mkfs.ext4 (latest runner)
            os: ubuntu-latest
            mkfs: ""
            big: ""
          - name: stock mkfs.ext4 (ubuntu-22.04)
            os: ubuntu-22.04
            mkfs: ""
            big: ""
          - name: skeleton layout, 512-byte inodes, no journal
            os: ubuntu-24.04
            mkfs: "-I 512 -O ^has_journal,^orphan_file"
            big: big
          # Large xattr values in EA inodes; the clone goes onto an ext4
          # formatted the same way (scripts/e2e-clone.sh).
          - name: skeleton layout with ea_inode
            os: ubuntu-24.04
            mkfs: "-I 512 -O ^has_journal,^orphan_file,ea_inode"
            big: big
          - name: 1 KiB blocks, 128-byte inodes
            os: ubuntu-24.04
            mkfs: "-b 1024 -I 128"
            big: ""
          - name: ext3-style block maps
            os: ubuntu-24.04
            mkfs: "-b 1024 -O ^extent,^64bit,^flex_bg,^huge_file,^metadata_csum,^metadata_csum_seed"
            big: big
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs acl attr rsync
      - name: Format, populate, clone and compare
        env:
          MKFS_OPTS: ${{ matrix.mkfs }}
        # sudo on the runners refuses -E, so pass what the script needs explicitly.
        run: sudo env "PATH=$PATH" "MKFS_OPTS=$MKFS_OPTS" scripts/e2e-clone.sh ${{ matrix.big }}
